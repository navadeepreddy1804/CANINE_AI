name: Backend Security Review

on:
  push:
    branches:
      - main
    paths:
      - 'BrainBattleBackend/**'
  pull_request:
    paths:
      - 'BrainBattleBackend/**'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E Dependencies (for exceljs)
        working-directory: ./BrainBattleE2E
        run: npm install

      - name: Run Backend Security Scan
        working-directory: ./BrainBattleBackend
        env:
          NODE_PATH: ${{ github.workspace }}/BrainBattleE2E/node_modules
        run: |
          node scripts/generateSecuritySuite.js
          
          echo "### Backend Security Findings" >> $GITHUB_STEP_SUMMARY
          cat executive-summary.md >> $GITHUB_STEP_SUMMARY
          
          CRITICAL_COUNT=$(grep -i "Critical:" executive-summary.md | awk '{print $2}' | tr -d ' *')
          if [[ "$CRITICAL_COUNT" -gt 0 ]]; then
            echo "Security gate failed! $CRITICAL_COUNT critical vulnerabilities found."
            exit 1
          fi

      - name: Upload Security Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-findings
          path: |
            BrainBattleBackend/findings.xlsx
            BrainBattleBackend/security-review.md
            BrainBattleBackend/dependency-report.md
