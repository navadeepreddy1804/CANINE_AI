name: Android Appium E2E Automation & Reporting Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to execute'
        required: false
        default: 'all'
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Stage 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Stage 2 - Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Stage 3 - Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'automation/mobile/package.json'

      - name: Stage 4 - Setup Android SDK & Command Line Tools
        uses: android-actions/setup-android@v3

      - name: Stage 5 - Build Android APK (Debug)
        run: |
          cd android-app
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../automation/mobile/app
          cp app/build/outputs/apk/debug/app-debug.apk ../automation/mobile/app/app-debug.apk

      - name: Stage 6 & 7 - Start Android Emulator & Verify Readiness
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Pixel_4
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            echo "Emulator booted successfully."

      - name: Stage 8 - Install Dependencies & Drivers
        run: |
          cd automation/mobile
          npm ci
          npx appium driver install uiautomator2 || true

      - name: Stage 9 & 10 - Start Appium Server & Verify Health
        run: |
          npx appium --log automation/mobile/logs/appium.log &
          sleep 10
          curl -s http://127.0.0.1:4723/status || echo "Appium server starting..."

      - name: Stage 11 - Execute Appium E2E Tests
        run: |
          cd automation/mobile
          npm test || echo "Test execution completed with status code $?"

      - name: Stage 14, 15, 16 & 17 - Generate Reports (Excel, HTML, JSON, Markdown)
        if: always()
        run: |
          cd automation/mobile
          npm run generate-reports

      - name: Stage 18 - Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-results
          path: |
            automation/mobile/reports/
            automation/mobile/screenshots/
            automation/mobile/logs/
          retention-days: 30

      - name: Stage 19 & 20 - Publish Reports to GitHub Pages & Update Execution History
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./automation/mobile/reports
          destination_dir: reports/latest
          keep_files: true

      - name: Stage 21 - Publish GitHub Action Summary
        if: always()
        run: |
          if [ -f automation/mobile/reports/Summary/summary.md ]; then
            cat automation/mobile/reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### Appium E2E Test Execution Finished" >> $GITHUB_STEP_SUMMARY
          fi
