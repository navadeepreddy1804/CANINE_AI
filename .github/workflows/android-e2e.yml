name: Android Appium E2E

on:
  push:
    branches:
      - main
    paths:
      - 'BrainBattle/**'
      - 'BrainBattleAppium/**'
  pull_request:

permissions:
  contents: write # Needed for JamesIves action to push to gh-pages

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium Dependencies
        working-directory: ./BrainBattleAppium
        run: npm install

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug APK (Mock)
        working-directory: ./BrainBattle
        run: |
          # Normally: ./gradlew assembleDebug --no-daemon
          mkdir -p app/build/outputs/apk/debug/
          touch app/build/outputs/apk/debug/app-debug.apk

      - name: Run Appium Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ github.workspace }}/BrainBattle/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 29
          profile: Nexus 6
          script: |
            cd BrainBattleAppium
            chmod +x scripts/ci_run_tests.sh
            ./scripts/ci_run_tests.sh

      - name: Prepare Test Reports for Deployment
        run: |
          mkdir -p deploy_reports/reports/latest
          mkdir -p deploy_reports/reports/history/build-${{ github.run_number }}
          cp BrainBattleAppium/execution-report.html deploy_reports/reports/latest/execution-report.html || true
          cp BrainBattleAppium/execution-report.html deploy_reports/reports/history/build-${{ github.run_number }}/execution-report.html || true

      - name: Deploy to GitHub Pages (JamesIves)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy_reports
          target-folder: android-reports
