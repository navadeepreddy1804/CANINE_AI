version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: canineai-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS:?DB_PASS is required}
      - MYSQL_DATABASE=${DB_NAME:-canineai_dev}
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.backend
    container_name: canineai-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-canineai_dev}
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_TLS=${MAIL_TLS:-false}
      - MAIL_SMTP_AUTH=${MAIL_SMTP_AUTH:-false}
    volumes:
      - uploads-data:/app/uploads
      - reports-data:/app/reports
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started

  web-app:
    build:
      context: ../
      dockerfile: deployment/Dockerfile.webapp
    container_name: canineai-web-app
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CANINEAI_BACKEND_BASE_URL=http://backend:8080/api/v1
    restart: always
    depends_on:
      - backend

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: canineai-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENV=prod
      - LOG_LEVEL=info
      - BACKEND_CALLBACK_URL=http://backend:8080/api/v1/ai/callback
    volumes:
      - model-store:/app/trained-models
      - sample-store:/app/samples
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

volumes:
  mysql-data:
  uploads-data:
  reports-data:
  model-store:
  sample-store:
