<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:replace="~{fragments/components :: themeScript}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanineAI - System Diagnostic Exception</title>
    
    <!-- Bootstrap 5 CSS via Webjars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Unified Design System Theme -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        body {
            background: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            overflow-x: hidden;
        }
        .error-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: transform 0.3s ease;
        }
        .error-card:hover {
            transform: translateY(-5px);
        }
        .error-icon-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
        }
        .error-title {
            font-weight: 800;
            letter-spacing: -0.5px;
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            color: #f8fafc;
        }
        .error-code-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 0.35rem 1rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .error-message {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }
        .btn-action-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-pill {
            border-radius: 50px;
            padding: 0.6rem 1.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-primary-pill {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: none;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }
        .btn-primary-pill:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            color: #ffffff;
        }
        .btn-secondary-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }
        .btn-secondary-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; color: #0284c7; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .pulse-icon {
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <div class="error-card">
        
        <!-- DYNAMIC ICON CLASSIFIER -->
        <div class="error-icon-wrapper">
            <th:block th:switch="${errorCode}">
                <i th:case="'404'" class="fa fa-compass text-warning" style="font-size: 40px;"></i>
                <i th:case="'403'" class="fa fa-user-lock text-danger" style="font-size: 40px;"></i>
                <i th:case="'AI_OFFLINE'" class="fa fa-network-wired text-info pulse-icon" style="font-size: 40px;"></i>
                <i th:case="*" class="fa fa-triangle-exclamation text-danger" style="font-size: 40px;"></i>
            </th:block>
        </div>

        <!-- DYNAMIC BADGE -->
        <div>
            <span class="error-code-badge" th:text="'STATUS CODE: ' + ${errorCode}">STATUS CODE: 500</span>
        </div>

        <!-- DYNAMIC TITLE -->
        <h2 class="error-title">
            <th:block th:switch="${errorCode}">
                <span th:case="'404'">Route Map Dispatched Out</span>
                <span th:case="'403'">Clinician Access Denied</span>
                <span th:case="'AI_OFFLINE'">CanineAI Engine Unreachable</span>
                <span th:case="*">Pipeline Process Exception</span>
            </th:block>
        </h2>

        <!-- DYNAMIC MESSAGE -->
        <p class="error-message" th:text="${errorMessage}">We couldn't complete your request right now. We're working on it. Please try again.</p>

        <!-- DYNAMIC ACTIONS -->
        <div class="btn-action-group">
            <button onclick="location.reload()" class="btn btn-pill btn-primary-pill">
                <i class="fa fa-rotate me-1.5"></i> Retry Connection
            </button>
            <button onclick="history.back()" class="btn btn-pill btn-secondary-pill">
                <i class="fa fa-arrow-left me-1.5"></i> Back to Workspace
            </button>
            <a href="/home" class="btn btn-pill btn-secondary-pill">
                <i class="fa fa-house me-1.5"></i> Dashboard Home
            </a>
        </div>

        <div class="mt-4 border-top pt-3" style="border-color: rgba(255, 255, 255, 0.05) !important;">
            <a href="#" onclick="alert('Our PACS diagnostics telemetry has reported this incident. Backup synchronizers are working on resolution.')" class="text-decoration-none text-muted small">
                <i class="fa fa-circle-question me-1"></i> Report Telemetry Node
            </a>
        </div>

    </div>

</body>
</html>
