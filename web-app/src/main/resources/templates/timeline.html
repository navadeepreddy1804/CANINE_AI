<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:replace="~{fragments/components :: themeScript}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanineAI - Clinical Audit Timeline</title>
    
    <!-- Bootstrap 5 CSS via Webjars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Unified Design System Theme, Dashboard & Notification CSS -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link class="styles" rel="stylesheet" th:href="@{/css/notification.css}">
</head>
<body>

    <!-- Unified Navigation Header -->
    <div th:replace="~{fragments/components :: header}"></div>

    <div class="container-fluid">
        <div class="row">
            
            <!-- Unified Sidebar Navigation -->
            <div th:replace="~{fragments/components :: sidebar(activePage='history')}"></div>

            <!-- Main Timeline content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 main-content">
                
                <!-- Headline Header -->
                <div class="d-flex justify-content-between align-items-center mb-4 text-start">
                    <div>
                        <h2 class="h3 font-weight-black text-dark mb-1">Clinical Audit Log</h2>
                        <p class="text-secondary small mb-0">Review chronological changes, patient admissions, and AI executions.</p>
                    </div>
                </div>

                <!-- Searching & Filter actions row -->
                <div class="card p-3 mb-4">
                    <form th:action="@{/timeline}" method="GET" class="row g-2 align-items-center">
                        <div class="col-md-6 col-lg-7">
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="fa fa-search text-muted"></i></span>
                                <input type="text" name="search" th:value="${search}" class="form-control bg-light border-0" placeholder="Search logs by Patient EMR Name, Operator...">
                            </div>
                        </div>
                        <div class="col-md-4 col-lg-3">
                            <button type="button" id="timeline-filter-toggle" class="btn btn-outline-secondary w-100">
                                <i class="fa fa-filter me-2"></i> Category Filters
                            </button>
                        </div>
                        <div class="col-md-2 col-lg-2">
                            <button type="submit" class="btn btn-primary w-100">Filter</button>
                        </div>

                        <!-- Collapsible Filter Drawer -->
                        <div id="timeline-filter-drawer" class="col-12 mt-3 pt-3 border-top d-none">
                            <div class="row g-3 text-start">
                                <div class="col-md-6">
                                    <label class="form-label font-weight-bold small">Category</label>
                                    <select name="category" class="form-control">
                                        <option value="">All Categories</option>
                                        <option value="AI" th:selected="${category == 'AI'}">Artificial Intelligence (AI)</option>
                                        <option value="Upload" th:selected="${category == 'Upload'}">Scan Upload</option>
                                        <option value="Patient" th:selected="${category == 'Patient'}">Patient EMR</option>
                                        <option value="Security" th:selected="${category == 'Security'}">Security & Settings</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Timeline Layout card -->
                <div class="card p-4">
                    <div class="audit-timeline-container text-start">
                        <div th:each="t : ${timeline}" 
                             class="audit-timeline-row p-3 mb-3 border rounded-3 bg-card-bg shadow-sm cursor-pointer history-row-item" 
                             th:data-patient-id="${t.patientId}" 
                             th:data-study-id="${t.studyId}">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="d-flex align-items-center gap-2 mb-1">
                                        <span class="badge bg-primary px-2 py-1" th:text="${t.prediction != null ? t.prediction : 'COMPLETED'}">IMPACTED</span>
                                        <span class="fw-bold text-dark" th:text="${t.patientName != null ? t.patientName : 'Patient'}">Patient Name</span>
                                        <span class="small text-muted" th:text="${t.patientDisplayId != null ? '(' + t.patientDisplayId + ')' : ''}">(PT-00001)</span>
                                    </div>
                                    <p class="text-secondary small mb-1" th:text="${'Study: ' + (t.studyDisplayId != null ? t.studyDisplayId : t.studyId) + ' • Operator: ' + (t.createdBy != null ? t.createdBy : 'System')}">Study Info</p>
                                    <span class="small text-muted font-weight-bold" th:text="${'Confidence: ' + (t.confidence != null ? t.confidence : 'N/A')}">Confidence</span>
                                </div>
                                <div class="text-end">
                                    <span class="badge bg-success mb-1" th:text="${t.status != null ? t.status : 'Completed'}">Completed</span>
                                    <div class="small text-muted" th:text="${t.completedAt != null ? #strings.substring(t.completedAt.toString(), 0, 19).replace('T', ' ') : 'Date unavailable'}">08 Aug 2026, 08:32 AM</div>
                                </div>
                            </div>
                        </div>
                        <div th:if="${#lists.isEmpty(timeline)}" class="text-center p-5 text-secondary">
                            <i class="fa fa-history fa-3x mb-3 text-muted"></i>
                            <p class="mb-0">No history logs recorded yet.</p>
                        </div>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- UI Core webjars & helper scripts -->
    <div th:replace="~{fragments/components :: scripts}"></div>
    <script th:src="@{/js/notification.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.history-row-item').forEach(function(row) {
                row.addEventListener('click', function() {
                    var patientId = this.getAttribute('data-patient-id');
                    var studyId = this.getAttribute('data-study-id');
                    if (patientId && studyId && patientId !== 'null' && studyId !== 'null') {
                        window.location.href = '/analysis?patientId=' + encodeURIComponent(patientId) + '&studyId=' + encodeURIComponent(studyId);
                    }
                });
            });
        });
    </script>
</body>
</html>
