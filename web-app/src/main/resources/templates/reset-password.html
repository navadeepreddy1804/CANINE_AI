<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:replace="~{fragments/components :: themeScript}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanineAI - Reset Password</title>
    
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">
    <button type="button" class="auth-theme-toggle" onclick="CanineUI.toggleTheme()" aria-label="Toggle theme">
        <i class="fa fa-adjust"></i>
    </button>

    <div class="login-container">
        
        <div class="org-logo-container d-flex justify-content-center mb-3">
            <div th:replace="~{fragments/components :: logo(64)}"></div>
        </div>

        <h1 class="h3 font-weight-bold mb-1">Set New Password</h1>
        <p class="text-secondary small mb-3">Enter your new credentials securely</p>
        
        <div class="login-card">
            
            <div th:if="${error}" class="alert-banner alert-error mb-3" role="alert">
                <i class="fa fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/reset-password}" method="POST" class="needs-validation" id="resetForm" novalidate>
                <input type="hidden" name="token" th:value="${resetToken}">
                
                <div class="form-group mb-3 text-start">
                    <label for="newPassword" class="form-label font-weight-bold small">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" class="form-control" required minlength="8">
                    <div class="invalid-feedback small">Must be at least 8 characters.</div>
                </div>
                
                <div class="form-group mb-4 text-start">
                    <label for="confirmPassword" class="form-label font-weight-bold small">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                    <div class="invalid-feedback small">Passwords must match.</div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 shadow-sm" id="resetBtn" disabled>Reset Password</button>
            </form>
            
            <div class="mt-4 text-center">
                <a th:href="@{/login}" class="small font-weight-bold text-secondary text-decoration-none">
                    <i class="fa fa-arrow-left me-1"></i> Back to Sign In
                </a>
            </div>
        </div>

        <div class="login-footer">
            <div>CanineAI Suite v1.0.0</div>
            <div class="mt-1">
                <a href="#">Privacy Policy</a>
                <span class="mx-1 text-muted">•</span>
                <a href="#">Terms & Conditions</a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/components :: scripts}"></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const resetBtn = document.getElementById('resetBtn');
            
            function validate() {
                const isValid = newPassword.value.length >= 8 && 
                              newPassword.value === confirmPassword.value &&
                              /[A-Z]/.test(newPassword.value) && 
                              /[a-z]/.test(newPassword.value) && 
                              /\d/.test(newPassword.value);
                resetBtn.disabled = !isValid;
            }
            
            newPassword.addEventListener('input', validate);
            confirmPassword.addEventListener('input', validate);
            
            document.getElementById('resetForm').addEventListener('submit', function(e) {
                if (resetBtn.disabled) e.preventDefault();
            });
        });
    </script>
</body>
</html>
