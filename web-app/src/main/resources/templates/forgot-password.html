<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:replace="~{fragments/components :: themeScript}"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanineAI - Forgot Password</title>
    
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-body">
    <button type="button" class="auth-theme-toggle" onclick="CanineUI.toggleTheme()" aria-label="Toggle theme">
        <i class="fa fa-adjust"></i>
    </button>

    <div class="login-container">
        
        <div class="org-logo-container d-flex justify-content-center mb-3">
            <div th:replace="~{fragments/components :: logo(64)}"></div>
        </div>

        <h1 class="h3 font-weight-bold mb-1">Account Recovery</h1>
        <p class="text-secondary small mb-3">Reset your CanineAI credentials</p>
        
        <div class="login-card">
            
            <div th:if="${error}" class="alert-banner alert-error mb-3" role="alert">
                <i class="fa fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>
            
            <form th:if="${securityQuestion == null}" th:action="@{/forgot-password/question}" method="POST" class="needs-validation" novalidate>
                <p class="small text-secondary mb-3">Enter your registered email address to retrieve your security question.</p>
                <div class="form-group mb-3 text-start">
                    <label for="email" class="form-label font-weight-bold small">Email</label>
                    <input type="email" id="email" name="email" class="form-control" th:value="${email}" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 shadow-sm">Get Security Question</button>
            </form>
            
            <form th:if="${securityQuestion != null}" th:action="@{/forgot-password/verify}" method="POST" class="needs-validation" novalidate>
                <input type="hidden" name="email" th:value="${email}">
                <input type="hidden" name="securityQuestion" th:value="${securityQuestion}">
                
                <div class="form-group mb-3 text-start">
                    <label class="form-label font-weight-bold small">Security Question</label>
                    <p class="form-control bg-light" th:text="${securityQuestion}" readonly></p>
                </div>
                
                <div class="form-group mb-3 text-start">
                    <label for="securityAnswer" class="form-label font-weight-bold small">Your Answer</label>
                    <input type="text" id="securityAnswer" name="securityAnswer" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 shadow-sm">Verify & Proceed</button>
            </form>
            
            <div class="mt-4 text-center">
                <a th:href="@{/login}" class="small font-weight-bold text-secondary text-decoration-none">
                    <i class="fa fa-arrow-left me-1"></i> Back to Sign In
                </a>
            </div>
        </div>

        <div class="login-footer">
            <div>CanineAI Suite v1.0.0</div>
            <div class="mt-1">
                <a href="#">Privacy Policy</a>
                <span class="mx-1 text-muted">•</span>
                <a href="#">Terms & Conditions</a>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/components :: scripts}"></div>
</body>
</html>
